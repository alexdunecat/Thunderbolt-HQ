# Выпуск версии: поднять "version" в system.json, собрать архив (tools/make-dist.sh) и отправить в main.
# Ссылки manifest/download в system.json ведут на raw.githubusercontent.com (без переадресаций), релиз с тегом дублирует архив.
name: Release
on:
  push:
    branches: [main]
    paths: ["system.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка загрузки системы
        run: node tools/load-test.mjs
      - name: Проверки на заглушках
        run: node tests/run.mjs
      - name: Версия
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version system.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -f "dist/thunderbolt-shtab-$VERSION.zip" || { echo "Нет dist/thunderbolt-shtab-$VERSION.zip: запустите tools/make-dist.sh"; exit 1; }
          for m in system.json dist/system-jsdelivr.json; do
            jq -r .download "$m" | grep -q "/dist/thunderbolt-shtab-$VERSION.zip$" || { echo "В $m ссылка download не на архив $VERSION: запустите tools/make-dist.sh"; exit 1; }
          done
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Архив для релиза
        if: steps.v.outputs.exists == 'false'
        run: cp "dist/thunderbolt-shtab-${{ steps.v.outputs.version }}.zip" thunderbolt-shtab.zip
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Штаб ВВС Юктобании ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            system.json
            thunderbolt-shtab.zip
      - name: Сбросить кэш jsDelivr (запасной манифест)
        run: |
          VERSION=${{ steps.v.outputs.version }}
          for f in dist/system-jsdelivr.json system.json; do
            r=$(curl -sS "https://purge.jsdelivr.net/gh/alexdunecat/Thunderbolt-HQ@main/$f" | jq -c . 2>/dev/null || echo "нет ответа")
            echo "::notice::purge $f: $r"
          done
          for i in $(seq 1 12); do
            got=$(curl -fsS "https://cdn.jsdelivr.net/gh/alexdunecat/Thunderbolt-HQ@main/dist/system-jsdelivr.json" | jq -r .version) || got=""
            echo "jsDelivr: $got"; [ "$got" = "$VERSION" ] && { echo "::notice::jsDelivr отдаёт $got"; exit 0; }; sleep 20
          done
          echo "::warning::jsDelivr всё ещё отдаёт $got вместо $VERSION"
